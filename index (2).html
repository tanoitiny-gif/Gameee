<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Note Catcher</title>
<style>
:root{--ink:#2b2a4c;--cream:#fff6e5;--coral:#ff6b6b;--sun:#ffc93c;--teal:#2ec4b6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
body{font-family:"Sarabun","Noto Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif;color:var(--ink);background:#ffe9c7 radial-gradient(#f6d5a0 1.5px,transparent 1.6px) 0 0/22px 22px;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:max(10px,env(safe-area-inset-top)) 12px 104px}
.screen{display:none}.screen.on{display:block}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.logo{margin:0;font-size:28px;line-height:1;font-weight:900;color:var(--coral);text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);letter-spacing:.5px}
.logo small{display:block;margin-top:7px;font-size:12px;font-weight:700;color:var(--ink);text-shadow:none;letter-spacing:0}
.row{display:flex;gap:6px;align-items:center}
.pill{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 10px;font-weight:900;display:flex;gap:5px;align-items:center;box-shadow:0 3px 0 var(--ink);font-size:14px;white-space:nowrap}
.btn{border:3px solid var(--ink);border-radius:16px;padding:9px 16px;font:900 16px inherit;font-family:inherit;color:#fff;background:var(--coral);box-shadow:0 5px 0 var(--ink);cursor:pointer;touch-action:manipulation;text-shadow:0 2px 0 #0003}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#5b8def}.btn.ok{background:#27b873}.btn.sm{padding:6px 11px;font-size:14px;border-radius:14px}.btn.bad{background:#d63a56}
.btn:disabled{opacity:.5;filter:grayscale(.5)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;border:3px solid var(--ink);border-radius:14px;padding:3px 2px 4px;background:#fff;font:800 12px inherit;font-family:inherit;color:var(--ink);box-shadow:0 3px 0 var(--ink);line-height:1.2;display:flex;flex-direction:column;align-items:center}
.tab.on{background:var(--sun)}.tab:disabled{opacity:.55}
.rk{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:800;font-size:13px}
.xb{flex:1;height:12px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}.xb div{height:100%;background:var(--teal)}
.map{position:relative;width:100%;aspect-ratio:100/114;border-radius:26px;overflow:hidden;border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink)}
.map>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.wname{position:absolute;left:10px;top:10px;z-index:4;background:var(--cream);border:3px solid var(--ink);border-radius:99px;padding:3px 12px;font-weight:900;font-size:14px}
.node{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid var(--ink);background:var(--cream);font:900 19px inherit;font-family:inherit;color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;padding:0}
.node.done{background:var(--sun)}.node.lock{background:#cfcde0;cursor:default}
.node.now{background:var(--coral);color:#fff;animation:bob 1s infinite}
.node .st{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);display:flex;gap:1px}
@keyframes bob{50%{transform:translateY(-5px)}}
.car{position:absolute;width:64px;transform:translate(-50%,-74%);transition:left 1.4s ease-in-out,top 1.4s ease-in-out;pointer-events:none;z-index:3;filter:drop-shadow(0 4px 0 #0003)}
.car svg{display:block;margin:0 auto}.car .ch{animation:bob .7s infinite;margin-bottom:-12px}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.hud b{font-size:14px;display:flex;align-items:center;gap:6px;text-align:center}
.boss{background:#d63a56;color:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 6px;font-size:11px}
.bar{height:16px;background:#fff;border:3px solid var(--ink);border-radius:99px;overflow:hidden;margin-bottom:8px}
.bar div{height:100%;width:0;background:repeating-linear-gradient(45deg,#3ddc97 0 8px,#2fc785 8px 16px);transition:.3s}
.stat{display:flex;justify-content:space-between;gap:6px;margin-bottom:8px}
.field{position:relative;height:370px;border-radius:24px;border:4px solid var(--ink);overflow:hidden;box-shadow:0 6px 0 var(--ink)}
.floor{position:absolute;left:0;right:0;bottom:0;height:66px;border-top:4px solid var(--ink);display:flex;align-items:center;justify-content:center}
.ncard{position:absolute;left:50%;top:0;width:150px;margin-left:-75px;background:#fffaf0;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 #2b2a4c55;padding:0 4px 3px;text-align:center;will-change:transform}
.ncard.frz{box-shadow:0 0 0 4px #8fd3ff,0 5px 0 #2b2a4c55}
.ncard.pop{animation:pop .35s forwards}.ncard.shake{animation:shk .4s}
@keyframes pop{to{transform:translateY(var(--y)) scale(1.35);opacity:0}}
@keyframes shk{25%{margin-left:-90px}75%{margin-left:-60px}}
.tools{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;min-height:46px}
.itm{position:relative;width:48px;height:44px;border:3px solid var(--ink);border-radius:13px;background:#fff;box-shadow:0 3px 0 var(--ink);padding:0;display:inline-flex;align-items:center;justify-content:center;margin-right:6px}
.itm b{position:absolute;right:-6px;bottom:-7px;background:var(--ink);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center}
.itm:disabled{opacity:.4}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.key{border:3px solid var(--ink);border-radius:13px;background:var(--cream);padding:7px 0 5px;font:900 19px/1 inherit;font-family:inherit;color:var(--ink);box-shadow:0 4px 0 var(--ink);touch-action:manipulation}
.key small{display:block;margin-top:3px;font-size:10px;font-weight:700;color:#7b789c;min-height:12px}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);background:var(--sun)}
.chip{border:2.5px solid var(--ink);border-radius:12px;background:#fff;padding:5px 10px;font:800 13px inherit;font-family:inherit;color:var(--ink);margin:0 4px 4px 0;touch-action:manipulation}
.chip.on{background:var(--sun);box-shadow:0 2px 0 var(--ink)}
.chip.acc{font-size:20px;padding:2px 12px;margin:0 0 0 6px}
.hint{background:#ffe27a!important;animation:bob .5s infinite}
.fl{position:absolute;left:50%;transform:translateX(-50%);font-weight:900;font-size:22px;pointer-events:none;white-space:nowrap;animation:up .8s forwards;z-index:5;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 #fff,-2px 0 #fff}
@keyframes up{to{margin-top:-60px;opacity:0}}
.modal{position:fixed;inset:0;background:#2b2a4ccc;display:none;align-items:center;justify-content:center;padding:20px;z-index:30;overflow-y:auto}
.modal.on{display:flex}
.box{background:var(--cream);border:4px solid var(--ink);border-radius:28px;padding:22px;text-align:center;max-width:350px;width:100%;box-shadow:0 8px 0 var(--ink)}
.box h2{margin:8px 0 6px;font-size:25px}.box p{margin:0 0 16px;font-weight:700;line-height:1.5}
.box p.l{text-align:left;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.chc{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:12px 8px;text-align:center;box-shadow:0 5px 0 var(--ink);font-weight:900}
.chc.sel{background:#d8f8e6}.chc .btn{margin-top:8px}.chc small{display:block;font-size:12px;color:#5d5a80;font-weight:700;margin-top:2px;min-height:30px}
.card2{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:12px 14px;margin-bottom:14px;box-shadow:0 5px 0 var(--ink)}
.card2 h3{margin:0 0 2px;font-size:17px;display:flex;align-items:center;gap:8px}
.card2 p{margin:2px 0 10px;font-size:13px;font-weight:600;color:#5d5a80}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:2px dashed #e3d6bd;font-weight:800;font-size:14px}
.srow:last-child{border:0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kv div{background:var(--cream);border:2.5px solid var(--ink);border-radius:14px;padding:8px;text-align:center;font-size:12px;font-weight:700}
.kv b{display:block;font-size:20px}
.br{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px;font-weight:800}
.br span:first-child{width:84px;flex:none}.br i{flex:1;height:12px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;display:block}.br i b{display:block;height:100%}
.br em{width:36px;text-align:right;font-style:normal;flex:none}
.ach{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed #e3d6bd;font-size:13px}.ach b{display:block;font-size:14px}.ach.lk{opacity:.45;filter:grayscale(1)}.ach span.c{margin-left:auto;font-weight:900;white-space:nowrap}
textarea{width:100%;height:70px;border:3px solid var(--ink);border-radius:12px;padding:8px;font:12px monospace;background:#fff;color:var(--ink)}
#toast{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;z-index:40;pointer-events:none}
.tst{background:var(--ink);color:#fff;border-radius:14px;padding:9px 14px;font-weight:800;font-size:14px;box-shadow:0 4px 0 #0005;margin-top:6px;display:flex;gap:8px;align-items:center;animation:tin .3s,tout .4s 2.8s forwards;max-width:92vw}
@keyframes tin{from{transform:translateY(-20px);opacity:0}}@keyframes tout{to{opacity:0}}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;z-index:20;padding:0 10px max(8px,env(safe-area-inset-bottom));pointer-events:none}
.nav>div{pointer-events:auto;width:100%;max-width:500px;display:flex;gap:4px;background:var(--cream);border:3px solid var(--ink);border-radius:20px;padding:5px;box-shadow:0 5px 0 var(--ink)}
.nb{flex:1;border:0;background:transparent;border-radius:14px;padding:5px 0 3px;font:800 11px inherit;font-family:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.nb.on{background:var(--sun)}
</style>
</head>

</div>

spawn()}
function ui(){
$('hearts').innerHTML=G.mode==='practice'?'<b>∞</b>':[0,1,2].map(function(i){return heart(i<G.h,20)}).join('');
$('scr').innerHTML=t('score')+' <b>'+G.score+'</b>';var m=mult(G.combo);
$('cmb').innerHTML=icon('endless',16)+' <b>'+G.combo+'</b>'+(m>1?' ×'+m:'');$('cmb').style.opacity=G.combo>1?1:.45;
var p=G.L.t?G.d/G.L.t:G.mode==='endless'?(G.d%10)/10:(G.ok+G.bad?G.ok/(G.ok+G.bad):0);$('prog').style.width=Math.round(p*100)+'%'}
function itemsUI(){$('items').innerHTML=G.mode==='ear'&&0?'':ITM.map(function(k){return '<button class="itm" data-k="'+k+'" '+(S.items[k]<=0||G.mode==='practice'?'disabled':'')+'>'+iti(k,26)+'<b>'+S.items[k]+'</b></button>'}).join('')}
function accOn(){return G.L.acc>0}
function accUI(){var r=$('accrow');r.style.visibility=accOn()?'visible':'hidden';r.innerHTML=[-1,0,1].map(function(a){return '<button class="chip acc'+(G.sel===a?' on':'')+'" data-a="'+a+'">'+['♭','♮','♯'][a+1]+'</button>'}).join('');applyHint()}
function applyHint(){document.querySelectorAll('.hint').forEach(function(e){e.classList.remove('hint')});if(!G||!G.cur||!G.cur.hint)return;var sp=G.cur.sp,kb=$('keys').querySelector('[data-l="'+LET[sp.d%7]+'"]'),ab=$('accrow').querySelector('[data-a="'+sp.a+'"]');if(kb)kb.classList.add('hint');if(ab&&accOn())ab.classList.add('hint')}
function pick(){
var L=G.L,r=G.rnd,sp,id,n=0;
do{
if(G.mode==='ear')sp={d:28+Math.floor(r()*7),c:-1,p:0};
else{var c=L.cl[Math.floor(r()*L.cl.length)],p=L.lo+Math.floor(r()*(L.hi-L.lo+1));sp={d:CL[c]+p,c:c,p:p}}
sp.a=0;
if(r()<L.acc){var k=sp.d%7,o=[];if(SH.indexOf(k)>=0)o.push(1);if(FL.indexOf(k)>=0)o.push(-1);if(o.length)sp.a=o[Math.floor(r()*o.length)]}
id=sp.d+'_'+sp.c+'_'+sp.a}while(id===G.last&&++n<20);
G.last=id;return sp}
var SPK='<svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="'+INK+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h4l5-4v14l-5-4H3z" fill="#5b8def"/><path d="M16 8q3 4 0 8M19 5q6 7 0 14"/></svg>';
function spawn(){
if(!G)return;var sp=pick(),el=document.createElement('div');el.className='ncard';
if(G.mode==='ear'){el.style.top='80px';el.style.cursor='pointer';el.innerHTML='<div style="padding:14px 0 4px">'+SPK+'</div><div style="font-size:13px;font-weight:800">'+t('listen')+'</div><div style="font-size:11px;color:#7b789c;font-weight:700">'+t('tapRe')+'</div>';el.onpointerdown=function(){if(G&&G.cur&&!G.paused)tone(G.cur.sp,.7)};setTimeout(function(){if(G&&G.cur&&G.cur.el===el)tone(sp,.7)},250)}
else el.innerHTML=staff(sp)+'<div style="font-size:12px;font-weight:700;color:#7b789c;margin-top:-4px">'+(G.L.w<3&&G.mode!=='daily'&&G.mode!=='endless'&&G.mode!=='practice'?t('what'):t('cl')[sp.c])+'</div>';
$('field').appendChild(el);G.cur={sp:sp,el:el,t:performance.now(),t0:performance.now(),sh:0,y:0,hint:false};G.lock=false;G.sel=0;G.lt=0;accUI();
cancelAnimationFrame(raf);if(G.mode!=='ear')raf=requestAnimationFrame(loop)}
function loop(now){
if(!G||!G.cur)return;var c=G.cur,dt=G.lt?now-G.lt:0;G.lt=now;
if(G.paused||now<G.frz){c.t+=dt;c.sh+=dt;c.el.classList.toggle('frz',now<G.frz&&!G.paused)}else c.el.classList.remove('frz');
var p=(now-c.t)/G.L.dur,H=$('field').clientHeight-66-c.el.offsetHeight+10;
c.y=Math.min(p,1)*H;c.el.style.transform='translateY('+c.y+'px)';
if(p>=1&&!G.paused)fail(false);else raf=requestAnimationFrame(loop)}
function flo(tx,col){var e=document.createElement('div');e.className='fl';e.textContent=tx;e.style.color=col;e.style.top='50%';$('field').appendChild(e);setTimeout(function(){e.remove()},800)}
function rec(sp,ok,rt){
var s=S.st,k=sp.d%7,n=s.notes[k]||(s.notes[k]={n:0,ok:0});s.ans++;n.n++;
var cl=null;if(sp.c>=0)cl=s.clef[sp.c]||(s.clef[sp.c]={n:0,ok:0});if(cl)cl.n++;
if(ok){s.ok++;n.ok++;if(cl)cl.ok++;if(G.mode==='ear')s.ear++;else{s.time+=rt;if(rt<1200)s.fast++}if(sp.a)s.acc++}}
function ans(l){
if(!G||!G.cur||G.lock||G.paused)return;
var c=G.cur,sp=c.sp,rt=performance.now()-c.t0-c.sh,g=G;
G.lock=true;cancelAnimationFrame(raf);
var ok=LET[sp.d%7]===l&&sp.a===G.sel;
G.sel=0;rec(sp,ok,rt);
if(!ok){accUI();fail(true);return}
G.combo++;if(G.combo>G.maxc)G.maxc=G.combo;if(G.combo>S.st.combo)S.st.combo=G.combo;
var m=mult(G.combo),pts=10*m;G.score+=pts;G.d++;G.ok++;addXP(2);tone(sp,.4);flo('+'+pts+(m>1?' ×'+m:''),'#d99100');
if(G.mode==='endless'){var d=G.d,L=G.L;L.dur=Math.max(2200,7000*Math.pow(.97,d))*DM[S.set.diff];L.hi=Math.min(12,4+Math.floor(d/4));L.lo=-Math.min(4,Math.floor(d/6));L.cl=d<8?[0]:d<16?[0,1]:[0,1,2];L.acc=d>=10?.2:0;
if(G.combo%15===0&&G.h<3){G.h++;flo('♥','#d63a56')}}
G.cur=null;accUI();ui();chk();
c.el.style.setProperty('--y',c.y+'px');c.el.classList.add('pop');
setTimeout(function(){c.el.remove();if(G!==g)return;if(G.L.t&&G.d>=G.L.t)finish(true);else spawn()},380)}
function fail(wrong){
if(!G||!G.cur)return;cancelAnimationFrame(raf);G.lock=true;var g=G,c=G.cur;G.cur=null;if(!wrong)rec(c.sp,false,0);
G.combo=0;G.bad++;if(G.mode!=='practice')G.h--;ui();accUI();beep(150,.3,'sawtooth');
flo((wrong?t('wrong'):t('late'))+t('is')+nm(c.sp),'#d63a56');c.el.classList.add('shake');save();
setTimeout(function(){c.el.remove();if(G!==g)return;if(G.h<=0)finish(false);else spawn()},950)}
function useItem(k){
if(!G||!G.cur||G.paused||S.items[k]<=0||G.mode==='practice')return;
if(k==='f'){if(G.mode==='ear')return;G.frz=performance.now()+4500}
else if(k==='h'){if(G.h>=3)return;G.h++}
else{G.cur.hint=true;applyHint()}
S.items[k]--;save();itemsUI();ui()}
$('items').onclick=function(e){var b=e.target.closest('[data-k]');if(b)useItem(b.dataset.k)};
$('accrow').onpointerdown=function(e){var b=e.target.closest('[data-a]');if(!b||!G||G.paused)return;e.preventDefault();G.sel=+b.dataset.a;accUI()};
$('keys').onpointerdown=function(e){var b=e.target.closest('[data-l]');if(b){e.preventDefault();ans(b.dataset.l)}};
document.addEventListener('keydown',function(e){if(!G||cur()!=='sGame'||e.metaKey||e.ctrlKey||e.altKey)return;var k=e.key;
if(LET.indexOf(k.toUpperCase())>=0&&k.length===1)ans(k.toUpperCase());
else if(k==='1'||k==='2'||k==='3'){if(accOn()&&!G.paused){G.sel=+k-2;accUI()}}
else if(k==='p'||k==='P'||k==='Escape'){if(G.paused)return;pause()}
else if(k===' '){e.preventDefault();if(G.mode==='ear'&&G.cur&&!G.paused)tone(G.cur.sp,.7)}});
document.addEventListener('visibilitychange',function(){if(document.hidden&&G&&G.cur&&!G.paused)pause()});
function pause(){if(!G)return;G.paused=true;modal(icon('pause',48).replace(/#fff/g,INK),t('paused'),'',t('resume'),function(){G.paused=false;G.lt=0},t('quitT'),ask)}
function ask(){if(!G)return;G.paused=true;modal('',t('quitT'),t('quitQ'),t('no'),function(){G.paused=false;G.lt=0},t('yes'),quit)}
$('pause').onclick=pause;$('quit').onclick=ask;
function quit(){if(!G)return;cancelAnimationFrame(raf);if(G.mode==='endless'){finish(false);return}if(G.mode==='practice'){finish(true);return}var m=G.mode;G=null;go(m==='story'?'sMap':'sModes')}

/* ---------- จบเกม ---------- */
function summary(){var tot=G.ok+G.bad;return t('score')+': <b>'+G.score+'</b><br>'+t('maxc')+': <b>'+G.maxc+'</b> · '+t('acc2')+': <b>'+(tot?Math.round(G.ok/tot*100):0)+'%</b>'}
function done(em,ti,p,b,fn,b2,fn2){var g=G;G=null;chk();save();modal(em,ti,p,b,fn,b2,fn2)}
function finish(win){
var m=G.mode,cm=CM[S.set.diff],sm=summary(),g=G.g,mode=m,gain=0,extra='';
if(m==='story'){
if(!win){var gg=g;done(animal(S.sel,88),t('lose'),t('loseP')+'<br>'+sm,t('retry')+' ↻',function(){begin('story',gg)},t('back'),function(){go('sMap')});return}
var st=G.h,newW=false;gain=Math.round((15+st*10+g*3+Math.floor(G.maxc/5)*2)*cm);S.coins+=gain;S.stars[g]=Math.max(S.stars[g]||0,st);S.st.won++;
if(G.score>(S.best[g]||0)){S.best[g]=G.score;extra+='<br><b>'+t('newBest')+'</b>'}
addXP(15+g);
if(g===S.unlocked&&g<31){S.unlocked=g+1;if((g+1)>>3!==g>>3)newW=true}
S.view=(newW?S.unlocked:g)>>3;
if(Math.random()<.2){var k=ITM[Math.floor(Math.random()*3)];S.items[k]++;extra+='<br>'+t('drop')+': '+iti(k,18)+' '+t('itn')[ITM.indexOf(k)]}
fanfare();var ss=star(st>0,34)+star(st>1,34)+star(st>2,34);
done(newW?vehicle(S.view,110):animal(S.sel,88)+'<div>'+ss+'</div>',newW?t('newMap'):(g===31?t('winAll'):t('win')),sm+'<br>'+t('reward')+' '+coin(20)+' <b>'+gain+'</b>'+extra+(newW?'<br>'+t('w')[S.view]+' '+t('waiting'):''),newW?t('goMap'):(g===31?t('toMap'):t('next')),function(){go('sMap')});return}
if(m==='endless'){
gain=Math.round(G.score/40*cm);S.coins+=gain;addXP(Math.floor(G.score/20));
if(G.score>S.hi.endless){S.hi.endless=G.score;extra='<br><b>'+t('newBest')+'</b>'}
fanfare();done(animal(S.sel,88),t('over'),sm+extra+'<br>'+t('reward')+' '+coin(20)+' <b>'+gain+'</b>',t('retry')+' ↻',function(){begin('endless')},t('back'),function(){go('sModes')});return}
if(m==='practice'){addXP(Math.floor(G.ok/3));done(animal(S.sel,88),t('sess'),sm,t('back'),function(){go('sModes')});return}
if(m==='ear'){
if(!win){done(animal(S.sel,88),t('lose'),t('loseP')+'<br>'+sm,t('retry')+' ↻',function(){begin('ear')},t('back'),function(){go('sModes')});return}
gain=Math.round((20+G.h*5+G.ok*2)*cm);S.coins+=gain;addXP(10);fanfare();
done(animal(S.sel,88),t('earDone'),sm+'<br>'+t('reward')+' '+coin(20)+' <b>'+gain+'</b>',t('back'),function(){go('sModes')},t('retry'),function(){begin('ear')});return}
/* daily */
var first=!(S.dc.date===today()&&S.dc.done);
if(!win){done(animal(S.sel,88),t('lose'),t('loseP')+'<br>'+sm,t('retry')+' ↻',function(){begin('daily')},t('back'),function(){go('sModes')});return}
if(S.dc.date!==today())S.dc={date:today(),done:false,n:S.dc.n,best:0};
if(G.score>S.dc.best)S.dc.best=G.score;
if(first){gain=Math.round((60+G.h*10)*cm);S.coins+=gain;S.dc.done=true;S.dc.n++;addXP(25)}
fanfare();done(animal(S.sel,88),t('dailyDone'),sm+(first?'<br>'+t('reward')+' '+coin(20)+' <b>'+gain+'</b>':''),t('back'),function(){go('sModes')})}

/* ---------- เริ่มเกม ---------- */
function tutorial(next){modal(animal(S.sel,70),t('tT'),t('tP'),t('tOk'),function(){S.tut=true;save();if(next)next()},null,null,true)}
function login(){
if(S.daily.last===today())return;
var y=today(new Date(Date.now()-864e5)),n=S.daily.last===y?S.daily.streak+1:1,c=20+Math.min(n,7)*10;
modal(animal(S.sel,80),t('dT'),t('dS')+': <b>'+n+'</b> '+t('days')+'<br>'+coin(20)+' <b>+'+c+'</b>',t('claim'),function(){S.daily={last:today(),streak:n};S.coins+=c;beep(880,.3);chk();go(cur())})}
applyLang();go('sMap');
if(!S.tut)tutorial(login);else login();
})();
</script>
